# Config CI untuk backend-go — dibaca oleh shared library (AD-15)
app_name: backend-go
language: go

test:
  command: "go test -v -cover ./..."

registry:
  region: asia-southeast1
  project_id: nsr-devops
  repository: docker-images-course

gitops:
  repo_url: github.com/cinemaxxi-team/devops_architecture.git
  branch: main
  path: apps/backend-go/overlays/development

build:
  tool: docker
  branch: development

slack:
  channel: "#deployments"

agent_label: "vm-jenkins"
