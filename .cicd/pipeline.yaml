# Config CI untuk backend-go — dibaca oleh shared library setelah checkout repo ini
# Repo ini: https://github.com/YOUR_ORG/backend-go.git (repo apps terpisah)
app_name: backend-go
language: go

test:
  command: "go test -v -cover ./..."

registry:
  region: asia-southeast1
  project_id: nsr-devops       # <- GANTI dengan GCP project ID kamu
  repository: docker-images-course

gitops:
  repo_url: github.com/cinemaxxi-team/devops_architecture.git  # <- GANTI repo gitops kamu (tanpa https://)
  branch: main
  path: course-project/05-gitops/applications/development/backend-go/patch  # path di dalam repo gitops
  rollout_file: rollout.yaml

build:
  tool: docker
  branch: development  # hanya branch ini yang build+push+update gitops

slack:
  channel: "#devops-course"

agent_label: "built-in"
